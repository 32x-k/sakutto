name: Firefox for Android Lite XPI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firefox-android.yml'
      - 'src/**'
      - 'public/**'
      - 'scripts/build-firefox-android.mjs'
      - 'scripts/sync-pdfjs.mjs'
      - 'scripts/sync-licenses.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wxt.config.ts'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-xpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build lightweight Firefox for Android XPI
        run: pnpm build:firefox-android

      - name: Locate built XPI and commit metadata
        id: xpi
        shell: bash
        run: |
          set -euo pipefail
          file="$(ls -1 .output/sakutto-*-firefox-android-lite.xpi | head -n 1)"
          if [ ! -f "$file" ]; then
            echo "Android XPI not found" >&2
            exit 1
          fi
          name="$(basename "$file")"
          bytes="$(stat -c%s "$file")"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')"
          sha256="$(sha256sum "$file" | awk '{print $1}')"
          short_sha="$(git rev-parse --short HEAD)"
          full_sha="$(git rev-parse HEAD)"
          commit_date="$(git show -s --format=%ci HEAD)"
          commit_subject="$(git show -s --format=%s HEAD)"

          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "mib=$mib" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"

          {
            echo "## Firefox for Android Lite XPI"
            echo ""
            echo "このビルドには以下のコミットまでの変更が含まれています："
            echo ""
            echo "- **最新コミット**: [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${full_sha}) — ${commit_subject}"
            echo "- **フル SHA**: \`${full_sha}\`"
            echo "- **コミット日時**: ${commit_date}"
            echo "- **ファイル**: \`${name}\` (${mib} MiB)"
            echo "- **SHA-256**: \`${sha256}\`"
            echo "- **ビルドログ**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "### 含まれる直近のコミット（最大10件）"
            echo ""
            git log -n 10 --pretty=format:'- `%h` %s (%cs)'
            echo ""
          } > /tmp/android-release-notes.md

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: sakutto-firefox-android-lite
          path: ${{ steps.xpi.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish rolling android-latest GitHub Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
          XPI_PATH: ${{ steps.xpi.outputs.path }}
          XPI_NAME: ${{ steps.xpi.outputs.name }}
          SHORT_SHA: ${{ steps.xpi.outputs.short_sha }}
          FULL_SHA: ${{ steps.xpi.outputs.full_sha }}
        run: |
          set -euo pipefail
          TAG="android-latest"
          TITLE="Firefox for Android Lite (latest — ${SHORT_SHA})"

          git tag -f "$TAG" "$FULL_SHA"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            for existing in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if [ "$existing" != "$XPI_NAME" ] && [[ "$existing" == *-firefox-android-lite.xpi ]]; then
                gh release delete-asset "$TAG" "$existing" --yes
              fi
            done
            gh release upload "$TAG" "$XPI_PATH" --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file /tmp/android-release-notes.md \
              --prerelease=false
          else
            gh release create "$TAG" "$XPI_PATH" \
              --title "$TITLE" \
              --notes-file /tmp/android-release-notes.md
          fi

      - name: Attach XPI to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          XPI_PATH: ${{ steps.xpi.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI_PATH" --clobber
          else
            gh release create "$TAG" "$XPI_PATH" \
              --title "$TAG" \
              --notes-file /tmp/android-release-notes.md
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/android-release-notes.md ]; then
            cat /tmp/android-release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi
