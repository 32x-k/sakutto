name: Firefox for Android Lite XPI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/build-firefox-android.mjs'
      - 'scripts/sync-pdfjs.mjs'
      - 'scripts/sync-licenses.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wxt.config.ts'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android-xpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build lightweight Firefox for Android XPI
        run: pnpm build:firefox-android

      - name: Locate built XPI
        id: xpi
        shell: bash
        run: |
          set -euo pipefail
          file="$(ls -1 .output/sakutto-*-firefox-android-lite.xpi | head -n 1)"
          if [ ! -f "$file" ]; then
            echo "Android XPI not found" >&2
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: sakutto-firefox-android-lite
          path: ${{ steps.xpi.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Attach XPI to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          XPI_PATH: ${{ steps.xpi.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$XPI_PATH" --clobber
          else
            gh release create "$TAG" "$XPI_PATH" --title "$TAG" --generate-notes
          fi

      - name: Job summary
        if: always()
        env:
          XPI_NAME: ${{ steps.xpi.outputs.name }}
        run: |
          {
            echo "## Firefox for Android Lite XPI"
            echo ""
            echo "- artifact: \`${XPI_NAME:-unknown}\`"
            echo "- download from this workflow run's Artifacts section"
          } >> "$GITHUB_STEP_SUMMARY"
